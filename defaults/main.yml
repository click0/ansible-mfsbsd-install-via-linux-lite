---

mil_script_name: 'install_mfsbsd_iso.sh'
mil_mfsbsd_iso_url: '' # 'https://mfsbsd.vx.sk/files/iso/14/amd64/mfsbsd-14.0-RELEASE-amd64.iso'
mil_mfsbsd_iso_hash: '' # 'bffaf11a441105b54823981416ae0166'
mil_mfsbsd_password: '' # default - 'mfsroot'
mil_iface: '' # Linux interface to take the settings from (ens3, eth0); default - the one with the default route
mil_bsd_iface: '' # FreeBSD name of that interface (em0, igb0, vtnet0); default - guessed from the Linux driver
mil_need_free_space: '' # default '99'	# in megabytes! Suffixes M and G are accepted
mil_hostname: 'mfsbsd-' # 'YOURHOSTNAME'
mil_force_uefi: false # force UEFI boot mode (auto-detected by default)
mil_network_mode: '' # '' - as in Linux (auto-detect) | dhcp | static

# After the reboot the role waits (from the controller) until sshd of MfsBSD answers.
mil_reboot_wait: true
mil_reboot_timeout: '600' # seconds
mil_reboot_wait_host: '' # default - ansible_host
mil_reboot_wait_port: '' # default - ansible_port, else 22

# Only pass non-empty options to the script.
# Passing empty values (e.g. -m '' -a '') breaks the script.
mil_script_options: >-
  {% if mil_mfsbsd_iso_url %} -m {{ mil_mfsbsd_iso_url | string | quote }}{% endif %}
  {% if mil_mfsbsd_iso_hash %} -a {{ mil_mfsbsd_iso_hash | string | quote }}{% endif %}
  {% if mil_hostname %} -H {{ mil_hostname | string | quote }}{% endif %}
  {% if mil_mfsbsd_password %} -p {{ mil_mfsbsd_password | string | quote }}{% endif %}
  {% if mil_iface %} -i {{ mil_iface | string | quote }}{% endif %}
  {% if mil_bsd_iface %} -I {{ mil_bsd_iface | string | quote }}{% endif %}
  {% if mil_need_free_space %} -s {{ mil_need_free_space | string | quote }}{% endif %}
  {% if mil_force_uefi %} -U{% endif %}
  {% if mil_network_mode == 'dhcp' %} -D{% elif mil_network_mode == 'static' %} -S{% endif %}
