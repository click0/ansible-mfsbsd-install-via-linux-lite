---
- name: Check the role variables
  ansible.builtin.assert:
    that:
      - mil_network_mode in ['', 'dhcp', 'static']
    fail_msg: "mil_network_mode must be empty, 'dhcp' or 'static'"
    quiet: true

- name: Install the minimum required software for further work.
  include_tasks: 0-pre-install.yml

- name: Upload files
  include_tasks: upload_files.yml

- name: Install script
  include_tasks: 1-install_mfsbsd_iso.yml

- name: Reboot the server
  include_tasks: reboot.yml
