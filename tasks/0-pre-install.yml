---

# raw: works on a host that has no python yet
- name: Make sure python3 is installed
  ansible.builtin.raw: >-
    command -v python3 >/dev/null 2>&1 ||
    { if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get -y install python3;
    else yum -y install python3; fi; }
  changed_when: false

- name: Install python3-apt on Debian-like systems
  ansible.builtin.raw: >-
    if command -v apt-get >/dev/null 2>&1 && [ ! -e /usr/share/doc/python3-apt ]; then
    apt-get update; apt-get -y install python3-apt; fi
  changed_when: false

- name: Install ca-certificates, wget
  ansible.builtin.package:
    name:
      - ca-certificates
      - wget
    state: present
